<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypingClub Pro — Loading</title>
  <meta name="description" content="Loading TypingClub Pro — skeleton screen for the home page." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./skeleton.css" />
</head>

<body>

  <!-- ===================== NAV SKELETON ===================== -->
  <header class="sk-nav" aria-hidden="true">

    <!-- Brand logo -->
    <div class="sk sk-brand sk-d1"></div>

    <!-- Nav links -->
    <div class="sk sk-nav-link sk-d2"></div>

    <!-- WPM badge + theme btn -->
    <div class="sk sk-wpm-badge sk-pill sk-d3"></div>
    <div class="sk sk-theme-btn sk-pulse sk-d4"></div>

  </header>

  <!-- ===================== HERO STAGE SKELETON ===================== -->
  <section class="sk-hero-stage" aria-hidden="true">

    <!-- Giant title background -->
    <div class="sk sk-hero-bg-text sk-d1"></div>

    <!-- Left col: description + badge circle -->
    <div class="sk-hero-left">
      <div class="sk sk-hero-desc sk-d2" style="width:85%;"></div>
      <div class="sk sk-hero-desc sk-d3" style="width:65%;"></div>
      <div class="sk sk-hero-desc sk-d4" style="width:75%;"></div>
      <div class="sk sk-badge-circle sk-pulse sk-d5"></div>
    </div>

    <!-- Center: hero character -->
    <div class="sk sk-hero-center sk-rounded sk-d3"></div>

    <!-- Right col: card stack + subtitle -->
    <div class="sk-hero-right">
      <div class="sk-card-stack">
        <div class="sk sk-stack-card sk-rounded sk-d2"></div>
        <div class="sk sk-stack-card sk-rounded sk-d4"></div>
        <div class="sk sk-stack-card sk-rounded sk-d3"></div>
      </div>
      <div class="sk sk-hero-desc sk-d5" style="width:80%;"></div>
      <div class="sk sk-hero-desc sk-d6" style="width:60%;"></div>
    </div>

  </section>

  <!-- ===================== HERO BOTTOM GRID SKELETON ===================== -->
  <div class="sk-hero-grid" aria-hidden="true">
    <div class="sk sk-grid-text-lg sk-d1"></div>
    <div class="sk sk-grid-text-lg sk-d2"></div>
    <div class="sk sk-grid-text-lg sk-d3"></div>
  </div>

  <!-- ===================== MAIN CONTENT SKELETON ===================== -->
  <main class="sk-main-content" aria-busy="true" aria-label="Loading lessons">

    <!-- Hero text -->
    <div class="sk sk-section-title sk-d1"></div>
    <div class="sk sk-section-sub sk-d2"></div>
    <div class="sk sk-section-sub sk-d3" style="width:320px; margin-bottom:44px;"></div>

    <!-- Lesson section 1 (e.g. Beginner) -->
    <div class="sk-lesson-section">
      <div class="sk sk-lesson-section-title sk-d1"></div>
      <div class="sk-lesson-grid">
        <div class="sk sk-lesson-card sk-rounded sk-d1"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d2"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d3"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d4"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d5"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d6"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d7"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d8"></div>
      </div>
    </div>

    <!-- Lesson section 2 (e.g. Intermediate) -->
    <div class="sk-lesson-section">
      <div class="sk sk-lesson-section-title sk-d2"></div>
      <div class="sk-lesson-grid">
        <div class="sk sk-lesson-card sk-rounded sk-d2"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d3"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d4"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d5"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d6"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d7"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d8"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d1"></div>
      </div>
    </div>

    <!-- Lesson section 3 (e.g. Advanced) -->
    <div class="sk-lesson-section">
      <div class="sk sk-lesson-section-title sk-d3"></div>
      <div class="sk-lesson-grid">
        <div class="sk sk-lesson-card sk-rounded sk-d3"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d4"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d5"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d6"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d7"></div>
        <div class="sk sk-lesson-card sk-rounded sk-d1"></div>
      </div>
    </div>

  </main>

  <!-- ===================== FOOTER SKELETON ===================== -->
  <footer class="sk-footer" aria-hidden="true">

    <div style="display:flex; flex-direction:column;">
      <div class="sk sk-footer-logo sk-d1"></div>
      <div class="sk sk-footer-title sk-d2"></div>
      <div class="sk-footer-social">
        <div class="sk-pulse sk-social-icon sk-d3"></div>
        <div class="sk-pulse sk-social-icon sk-d4"></div>
        <div class="sk-pulse sk-social-icon sk-d5"></div>
        <div class="sk-pulse sk-social-icon sk-d6"></div>
      </div>
    </div>

    <div class="sk sk-footer-img sk-rounded sk-d4"></div>

  </footer>

  <!-- ===================== COPYRIGHT SKELETON ===================== -->
  <div class="sk-copyright" aria-hidden="true">
    <div class="sk sk-copyright-text sk-pill sk-d1"></div>
  </div>

</body>

</html>
