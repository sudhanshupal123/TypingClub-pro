<html lang="en">

<head>

  <title>TypingClub Pro — Game</title>
  <meta name="description" content="Practice typing and improve your WPM speed with TypingClub Pro." />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>

<body class="game-body">

  <!-- Game Header -->
  <header class="game-header">
    <div class="game-header-inner">
      <!-- Back Button -->
      <button class="back-btn" id="backBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M11 14L6 9l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        Back
      </button>

      <!-- Level Info -->
      <div class="level-info">
        <span class="level-badge" id="levelBadge"></span>
        <span class="level-name" id="levelName"></span>
      </div>

      <!-- Stats Bar -->
      <div class="stats-bar">
        <!-- WPM -->
        <div class="stat-block" id="wpmBlock">
          <div class="stat-value" id="statWpm">0</div>
          <div class="stat-label">WPM</div>
        </div>
        <!-- Accuracy -->
        <div class="stat-block">
          <div class="stat-value" id="statAcc">0</div>
          <div class="stat-label">ACC %</div>
        </div>
        <!-- Timer -->
        <div class="stat-block" id="timeCount">
          <div class="stat-value"><span id="startminuts">0</span>:<span id="statTimer">0</span></div>
          <div class="stat-label">TIME</div>
        </div>
        <!-- Words -->
        <div class="stat-block">
          <div class="stat-value" id="statWords">0</div>
          <div class="stat-label">WORDS</div>
        </div>
      </div>

      <!-- Restart -->
      <button class="icon-btn" id="restartBtn" title="Restart">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path
            d="M1.5 9C1.5 5.134 4.686 2 8.5 2c2.3 0 4.34 1.1 5.65 2.8M16.5 9c0 3.866-3.134 7-7 7-2.3 0-4.34-1.1-5.65-2.8"
            stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M14.15 2L13.5 5.5l-3.5-.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <!-- theme mode -->
      <button class="ThemeMode">
        <img src="./images/dark-mode.png" alt="Theme">
      </button>
    </div>

    <!-- Progress Line -->
    <div class="lesson-progress-bar">
      <div class="lesson-progress-fill" id="lessonProgress"></div>
    </div>
  </header>
  <!-- Loading Spinner -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text">Loading words...</p>
  </div>
  <!-- Keyboard Hint (top) -->
  <div class="key-hint" id="keyHint" style="display: none;">
    <span class="key-hint-text">Press any key to start typing</span>
  </div>
  <!-- Main Game Area -->
  <main class="game-main">


    <!-- Text Display -->
    <div class="text-display-wrapper">
      <div class="text-display" id="textDisplay" tabindex="0">
        <!-- Words rendered by JS -->
      </div>
      <div class="errorRestart">
        <p>There are too many errors!</p>
        <button class="errorrestart">Restart</button>
      </div>
      <!-- Cursor Caret -->
      <div class="caret" id="caret"></div>
    </div>
    <!-- Lap Ticker (live word times) -->
    <div class="lap-strip" id="lapStrip">
      <!-- filled by JS as each word completes -->
    </div>
    <div class="keyboard-plugin">

  <!-- ===================== RESULTS MODAL ===================== -->
  <div class="modal-overlay" id="resultsModal" style="display:none;">
    <div class="modal-card analytics-card">

      <!-- Header -->
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Level Complete!</h2>
      </div>

      <!-- Top Stats Row -->
      <div class="modal-stats">
        <div class="modal-stat">
          <div class="modal-stat-value accent-text" id="resWpm">0</div>
          <div class="modal-stat-label">WPM</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-value" id="resAcc">0%</div>
          <div class="modal-stat-label">Accuracy</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-value" id="resTime">0:00</div>
          <div class="modal-stat-label">Total Time</div>
        </div>

        <div class="modal-stat">
          <div class="modal-stat-value" id="resCorrect">0</div>
          <div class="modal-stat-label">✓ Correct</div>
        </div>
        <div class="modal-stat">
          <div class="modal-stat-value" id="resErrors">0</div>
          <div class="modal-stat-label">✗ Errors</div>
        </div>
      </div>

      <!-- Tab: WPM Graph -->
      <div class="analytics-panel" id="panel-wpm">
        <div class="chart-title">WPM over every completed word</div>
        <div class="chart-wrap">
          Comming soon
        </div>

      </div>


      <!-- Action Buttons -->
      <div class="modal-actions">
        <button class="btn-secondary" id="retryBtn">↺ Retry</button>
        <button class="btn-primary" id="nextlessonBtn">Next Level →</button>
        <button class="btn-ghost">⬅ Map</button>
      </div>
      <!-- Stars -->
      <div class="star-rating">
        <span class="star" id="star1"><i class="fa-solid fa-star"></i></span>
        <span class="star" id="star2"><i class="fa-solid fa-star"></i></span>
        <span class="star" id="star3"><i class="fa-solid fa-star"></i></span>
      </div>
    </div>
  </div>
