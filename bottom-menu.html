<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bottom Navigation Menu</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #22232a;
      --muted: #737681;
      --border: #e5e5eb;
      --hover: #f0f0f5;
      --accent: #e9e9f1;
      --danger: #d83b4b;
      --shadow: 0 14px 40px rgba(20, 20, 40, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f5f8;
      color: var(--text);
      transition: background .2s, color .2s;
    }
    body.dark {
      color-scheme: dark;
      --bg: #202127;
      --text: #f4f4f7;
      --muted: #a5a6b1;
      --border: #3b3c46;
      --hover: #30313a;
      --accent: #3b3c49;
      --danger: #ff7785;
      --shadow: 0 14px 40px rgba(0, 0, 0, .35);
      background: #15161b;
    }
    .demo-note {
      max-width: 560px;
      margin: 70px auto 0;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }
    .demo-note h1 { color: var(--text); font-size: 24px; }
    .bottom-menu {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 10;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 19px;
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .nav-button {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 15px;
      color: var(--muted);
      background: transparent;
      transition: background .16s, color .16s, transform .16s;
    }
    .nav-button:hover { background: var(--hover); color: var(--text); }
    .nav-button.active { background: var(--accent); color: var(--text); }
    .nav-button:active { transform: scale(.94); }
    .icon {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .submenu {
      position: absolute;
      left: 50%;
      bottom: 70px;
      width: max-content;
      min-width: 210px;
      max-width: min(310px, calc(100vw - 28px));
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(22px);
      box-shadow: var(--shadow);
      transform: translateX(-50%) scale(1);
      transform-origin: bottom center;
      opacity: 1;
      pointer-events: auto;
      will-change: width, height, opacity, transform;
      transition:
        width .3s cubic-bezier(.45, 0, .25, 1),
        height .3s cubic-bezier(.45, 0, .25, 1),
        opacity .24s ease,
        transform .3s cubic-bezier(.45, 0, .25, 1);
    }
    .submenu[hidden] { display: none; }
    .submenu.is-opening {
      opacity: 0;
      transform: translateX(-50%) scale(.94, .9);
      pointer-events: none;
    }
    .submenu.is-closing {
      opacity: 0;
      transform: translateX(-50%) scale(.95, .9);
      pointer-events: none;
      transition-duration: .22s;
    }
    .submenu-content {
      padding: 6px;
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
      transform-origin: center;
      transition: opacity .22s ease, filter .25s ease, transform .25s ease;
    }
    .submenu-content.content-enter {
      opacity: 0;
      filter: blur(10px);
      transform: scale(.96);
    }
    @media (prefers-reduced-motion: reduce) {
      .submenu, .submenu-content { transition-duration: .01ms !important; }
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 11px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }
    .menu-item:hover { color: var(--text); background: var(--hover); }
    .menu-item .icon { width: 19px; height: 19px; }
    .search-wrap { position: relative; padding: 2px 2px 8px; }
    .search-wrap .icon {
      position: absolute;
      left: 12px;
      top: 12px;
      width: 17px;
      height: 17px;
    }
    .search-input {
      width: 100%;
      min-width: 225px;
      padding: 9px 10px 9px 36px;
      color: var(--text);
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      font-size: 14px;
    }
    .search-input:focus { border-color: #9294c5; box-shadow: 0 0 0 2px #9294c533; }
    .search-actions { display: flex; gap: 5px; }
    .search-actions .menu-item { justify-content: center; gap: 6px; padding: 9px 7px; background: var(--hover); }
    .separator { height: 1px; margin: 5px 2px; background: var(--border); }
    .menu-item.logout { color: var(--danger); }
    .theme-options { display: flex; gap: 5px; }
    .theme-options .menu-item { justify-content: center; gap: 6px; padding: 10px 9px; }
    .theme-options .menu-item.selected { color: var(--text); background: var(--accent); }
    .status { margin: 10px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
    @media (max-width: 380px) {
      .nav-button { width: 43px; height: 45px; }
      .toolbar { gap: 2px; }
      .theme-options { flex-direction: column; }
      .search-input { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="demo-note">
    <h1>Bottom Navigation Menu</h1>
    <p>Click an icon in the floating toolbar to open its submenu. Try switching the theme too.</p>
  </main>

  <!-- Inline SVG icons keep this demo dependency-free. -->
  <div class="bottom-menu" id="bottomMenu">
    <section class="submenu" id="submenu" hidden aria-live="polite">
      <div class="submenu-content" id="submenuContent"></div>
    </section>
    <nav class="toolbar" aria-label="Main navigation">
      <button class="nav-button" data-view="home" aria-label="Home" aria-expanded="false" title="Home">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="nav-button" data-view="search" aria-label="Search" aria-expanded="false" title="Search">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
      <button class="nav-button" data-view="notifications" aria-label="Notifications" aria-expanded="false" title="Notifications">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
      </button>
      <button class="nav-button" data-view="profile" aria-label="Profile" aria-expanded="false" title="Profile">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0M17 4l2 2 3-3"/></svg>
      </button>
      <button class="nav-button" data-view="theme" aria-label="Theme" aria-expanded="false" title="Theme">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      </button>
    </nav>
    <p class="status" id="status" role="status"></p>
  </div>

  <script>
    const menu = document.querySelector("#bottomMenu");
    const submenu = document.querySelector("#submenu");
    const submenuContent = document.querySelector("#submenuContent");
    const navButtons = [...document.querySelectorAll(".nav-button")];
    const status = document.querySelector("#status");

    const icons = {
      note: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></svg>',
      mic: '<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>',
      camera: '<svg class="icon" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h3l2-3h4l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>',
      filter: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10m-7 5h4"/><circle cx="8" cy="7" r="1.5"/><circle cx="15" cy="12" r="1.5"/></svg>',
      trending: '<svg class="icon" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-9M15 6h6v6"/></svg>',
      search: '<svg class="icon" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>',
      sun: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>',
      moon: '<svg class="icon" viewBox="0 0 24 24"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5z"/></svg>',
      computer: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>',
      user: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>'
    };

    const items = {
      home: [
        { icon: "note", text: "Note" },
        { icon: "mic", text: "Voice" },
        { icon: "camera", text: "Screenshot" }
      ],
      notifications: [
        { text: "Messages" },
        { text: "System Alerts" }
      ],
      profile: [
        { text: "My Account" },
        { text: "Settings" },
        { text: "Subscription / Billing" }
      ]
    };

    let currentView = "default";
    let currentTheme = "light";

    function makeButton(text, icon = "", extraClass = "") {
      const button = document.createElement("button");
      button.className = `menu-item ${extraClass}`.trim();
      button.type = "button";
      button.innerHTML = `${icons[icon] || ""}<span>${text}</span>`;
      button.addEventListener("click", () => {
        if (currentView === "home" || currentView === "notifications" || currentView === "profile") {
          status.textContent = `${text} selected (demo only)`;
        }
        if (text === "Logout") status.textContent = "Logout action needs your authentication logic.";
      });
      return button;
    }

    function renderView(view) {
      submenuContent.replaceChildren();

      if (view === "home" || view === "notifications" || view === "profile") {
        items[view].forEach(item => submenuContent.append(makeButton(item.text, item.icon)));
        if (view === "profile") {
          const line = document.createElement("div");
          line.className = "separator";
          submenuContent.append(line, makeButton("Logout", "", "logout"));
        }
      }

      if (view === "search") {
        const wrap = document.createElement("div");
        wrap.className = "search-wrap";
        wrap.innerHTML = `${icons.search}<input class="search-input" type="search" placeholder="Search..." aria-label="Search">`;
        submenuContent.append(wrap);
        const actions = document.createElement("div");
        actions.className = "search-actions";
        actions.append(makeButton("Filter", "filter"), makeButton("Trending", "trending"));
        submenuContent.append(actions);
        wrap.querySelector("input").focus();
      }

      if (view === "theme") {
        const options = document.createElement("div");
        options.className = "theme-options";
        [
          { key: "light", text: "Light", icon: "sun" },
          { key: "dark", text: "Dark", icon: "moon" },
          { key: "system", text: "System", icon: "computer" }
        ].forEach(option => {
          const button = makeButton(option.text, option.icon, currentTheme === option.key ? "selected" : "");
          button.addEventListener("click", () => setTheme(option.key));
          options.append(button);
        });
        submenuContent.append(options);
      }
    }

    function setTheme(theme) {
      currentTheme = theme;
      const useDark = theme === "dark" ||
        (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.body.classList.toggle("dark", useDark);
      status.textContent = `Theme: ${theme}`;
      renderView("theme");
    }

    let closeTimer = null;
    let resizeObserver = null;

    function closeView() {
      if (submenu.hidden || submenu.classList.contains("is-closing")) return;

      currentView = "default";
      navButtons.forEach(button => {
        button.classList.remove("active");
        button.setAttribute("aria-expanded", "false");
      });
      status.textContent = "";

      clearTimeout(closeTimer);
      submenu.classList.remove("is-opening");
      submenu.classList.add("is-closing");
      submenu.style.width = "0px";
      submenu.style.height = "0px";
      submenuContent.classList.add("content-enter");

      closeTimer = window.setTimeout(() => {
        submenu.hidden = true;
        submenu.classList.remove("is-closing");
        submenu.style.width = "";
        submenu.style.height = "";
      }, 240);
    }

    function openView(view) {
      // Clicking the currently open icon closes the submenu.
      if (currentView === view && !submenu.hidden) {
        closeView();
        return;
      }

      clearTimeout(closeTimer);
      const wasHidden = submenu.hidden;
      currentView = view;
      navButtons.forEach(button => {
        const active = button.dataset.view === currentView;
        button.classList.toggle("active", active);
        button.setAttribute("aria-expanded", String(active));
      });

      // Render first, then measure the real content size for the size animation.
      renderView(currentView);
      submenu.hidden = false;
      submenu.classList.remove("is-closing", "is-opening");
      submenuContent.classList.add("content-enter");

      // Measure natural dimensions without the previous animation's fixed size.
      submenu.style.width = "max-content";
      submenu.style.height = "auto";
      const targetWidth = Math.min(submenu.scrollWidth, window.innerWidth - 28);
      const targetHeight = submenu.scrollHeight;

      if (wasHidden) {
        submenu.style.width = "0px";
        submenu.style.height = "0px";
        submenu.classList.add("is-opening");
        // Force layout so the browser records the collapsed starting state.
        void submenu.offsetWidth;
        requestAnimationFrame(() => {
          submenu.classList.remove("is-opening");
          submenu.style.width = `${targetWidth}px`;
          submenu.style.height = `${targetHeight}px`;
          submenuContent.classList.remove("content-enter");
        });
      } else {
        // Switching between menus animates the box to the new measured size.
        submenu.style.width = `${targetWidth}px`;
        submenu.style.height = `${targetHeight}px`;
        requestAnimationFrame(() => submenuContent.classList.remove("content-enter"));
      }

      // Let the content size naturally settle after the transition.
      window.setTimeout(() => {
        if (currentView === view && !submenu.hidden) {
          submenu.style.width = "";
          submenu.style.height = "";
        }
      }, 320);
    }

    navButtons.forEach(button => {
      button.addEventListener("click", () => openView(button.dataset.view));
    });

    document.addEventListener("pointerdown", event => {
      if (!menu.contains(event.target)) closeView();
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => {
      if (currentTheme === "system") setTheme("system");
    });
  </script>
</body>
</html>
