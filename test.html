<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .letter_unit {
            color: #777;
        }

        .letter_unit.typed {
            color: #20c45a;
            /* green typed text */
        }

        .letter_unit.Current {
            color: white;
            border-right: 2px solid #20c45a;
            /* cursor */
        }

        .letter.Current {
            text-decoration: underline;
        }

        #typing {
            font-size: 3rem;
        }
    </style>
</head>

<body>
    <div id="typing">
        <span class="letter Current">
            <span class="letter_unit Current">t</span>
            <span class="letter_unit">y</span>
            <span class="letter_unit">p</span>
            <span class="letter_unit">e</span>
            <span class="letter_unit"> </span>
        </span>

        <span class="letter">
            <span class="letter_unit">w</span>
            <span class="letter_unit">r</span>
            <span class="letter_unit">i</span>
            <span class="letter_unit">t</span>
            <span class="letter_unit">e</span>
            <span class="letter_unit">r</span>
            <span class="letter_unit"> </span>
        </span>
        <span class="letter">
            <span class="letter_unit">w</span>
            <span class="letter_unit">r</span>
            <span class="letter_unit">i</span>
            <span class="letter_unit">t</span>
            <span class="letter_unit">e</span>
            <span class="letter_unit">r</span>
            <span class="letter_unit"> </span>
        </span>
        <span class="letter">
            <span class="letter_unit">p</span>
            <span class="letter_unit">o</span>
            <span class="letter_unit">w</span>
            <span class="letter_unit">e</span>
            <span class="letter_unit">r</span>
            <span class="letter_unit"> </span>
        </span>
    </div>
    <script>
        const words = [...document.querySelectorAll(".letter")];
        let wordIndex = 0;
        let charIndex = 0;

        function getCharacters() {
            return [...words[wordIndex].querySelectorAll(".letter_unit")];
        }

        document.addEventListener("keydown", (event) => {
            if (wordIndex >= words.length) return; // all text completed

            const characters = getCharacters();
           
            const currentChar = characters[charIndex];
     console.log(currentChar)
            // The expected character from your HTML, including a space
            const expectedKey = currentChar.textContent;

            // Do nothing if the typed key is not the expected one
            if (event.key !== expectedKey) return;

            // Make typed letter green
            currentChar.classList.remove("Current");
            currentChar.classList.add("typed");

            charIndex++;

            // Move cursor to next character in the same word
            if (charIndex < characters.length) {
                characters[charIndex].classList.add("Current");
                return;
            }

            // Word finished: remove active word class
            words[wordIndex].classList.remove("Current");
            wordIndex++;

            // Move Current class to next word and its first letter
            if (wordIndex < words.length) {
                charIndex = 0;
                words[wordIndex].classList.add("Current");
                words[wordIndex].querySelector(".letter_unit").classList.add("Current");
            }
        });
    </script>
</body>

</html>
